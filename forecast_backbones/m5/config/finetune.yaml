# M5 训练 / 评估配置（full 模式）= config.py 的 DEFAULT_CFG 落盘；改默认值两边一起改（tests/test_config.py 守住一致）。
# 线上零样本配置是 configs.yaml（没有 dataset.station_meta → legacy 模式），不要拿它训练。
run:
  model_name: m5
  seeds: [0]
  out_dir: runs/m5_baseline
dataset:
  pv_col: observe_power
  label_col: observe_power_future
  ts_col: timestamp_win
  station_id_col: station_id
  station_meta: forecast_backbones/m5/station_meta.csv   # 只取每站固定容量 cap_mw 与站号；经纬度只在几何变体（g1 / g2）里用
  station_meta_cols: null
  tz: Asia/Shanghai
  step_min: 15
  known_stations: null
  context_len: 672
  pred_len: 192
timesfm3:
  checkpoint: /data/tangqingang/timesfm-3.0-pytorch
  device: auto
  per_core_batch_size: 64
  nan_policy: interp
  make_positive: true
  use_znorm: false
  use_symmetric_averaging: true
  eager_init: true
features:
  past_future:
    - [general_ghi, general_ghi_predict]
    - [general_temp, general_temp_predict]
  past_only: []
  # D8：几何默认关（g1 变体打开）；history_envelope = C1 功率历史日形包络通道，envelope_nwp = C2 包络 × clip(GHI_nwp / GHI 历史包络)，都不需要坐标
  derived: {solar_elevation: false, clear_sky_power: false, history_envelope: false, envelope_nwp: false}
  envelope:                      # 包络参数（C1 / C2 与门控 / 路由 LoRA 的形势特征共用）
    quantile: 0.9                # 上下文 7 天同一时刻槽的分位
    smooth: 3                    # 环形滑动平均宽度（步）
    ghi: [general_ghi, general_ghi_predict]   # C2 与形势特征用的 GHI 列对 [历史, 未来]
    ghi_floor: 20.0              # GHI 包络低于它的步当夜间（比值记 0）
    clip_max: 1.2                # C2 比值上限
finetune:
  enabled: true
  inference_path: torch          # enabled=false 时零样本走哪条：torch | evaluator
  method: lora
  lora:
    rank: 8
    alpha: 16
    dropout: 0.05
    target_modules: [query_proj, key_proj, value_proj, out_proj]
    # 普通名字按模块名尾段匹配；'re:' 开头按完整路径 fullmatch（如 're:.*\.var_attn\.(query|key|value|out)_proj'）；
    # 空列表 = 不挂 LoRA（只训 head / unfreeze_modules）
    experts: 1                   # >1 = HydraLoRA 式：共享 A、K 个 B，按形势特征逐样本路由
    gate: false                  # Gated-LoRA：按形势特征逐样本调 LoRA 强度（初值 1 = 普通 LoRA）；与 experts>1 二选一
  unfreeze_output_head: true
  unfreeze_modules: []           # 整块解冻（全参数可训），如 [pre_transformer_resblock]
  # 以下适配器全部默认关（adapters.py）；关时模型与原 LoRA 逐位相同
  ia3: {target_modules: []}      # (IA)³ 逐通道缩放，靶点规则同 LoRA（不能与 LoRA 靶点重叠）
  prompt: {n_tokens: 0, per_station: false, station_dropout: 0.25, init_std: 0.02}   # 虚拟变量 soft prompt（0 = 关）
  static_embed: {enabled: false, dropout: 0.25}   # 零初始化静态加性嵌入：经纬度 / 海拔 / log 容量 / has_coords
  resblock_adapter: {rank: 0}    # 残差块输出上的非线性适配器（0 = 关）
  init_from: null                # LP-FT 热启动：训练前从该权重文件拷入同名可训参数；{seed} 换成本 run 种子
train:
  schedule:
    lr: 1.0e-4
    weight_decay: 0.01
    batch_size: 16                 # 全局 batch（所有卡合计）；每卡 = batch_size / 卡数，须整除
    max_steps: 4000
    epochs_max: 10
    warmup_steps: 0
    grad_clip: 1.0
    precision: fp32              # V100 不支持 bf16
    logging_steps: 20
    eval_every_steps: 250
    sampling: random
    progress_bar: true
    num_workers: 0
    lr_scheduler: cosine         # cosine | constant | constant_with_warmup | linear
  optim:                         # 参数分组（全 null = 单组）
    lora_plus_ratio: null        # LoRA+：lora_B 的 lr = lr × 该值（文献常用 16）
    head_lr: null                # output_head 单独的 lr
    adapter_lr: null             # 其余可训参数（解冻块、(IA)³、prompt、静态嵌入、门控网络）单独的 lr
  loss:
    night_weight: 1.0
    normalize_by_cap: true       # q、y 都除以该行 cap 再算 pinball；false = 真实单位（M6 旧口径）
  early_stop:
    metric: nanwang_after_pstar
    patience: 5
    nrmse_issue_every_min: 60
    smooth_k: 1
  ema_decay: null
  weights_path: ${run.out_dir}/model.safetensors
decision:
  physics:
    night_zero: false
    clear_sky_cap_ratio: null    # D8：无晴空上限，只钳到容量（g2 变体 = 1.05，与 M8 同口径）
    capacity_cap: true
    clip_negative: true
  point:
    default: median
    by_step: []
    floor_ratio: 0.2
    tau_grid_step: 0.005
    tail: flat                   # flat = p* 网格在 q0.1 / q0.9 之外平延；linear = 沿最外两档线性外推（钳 [0, cap]）
    shrink_factor: null
    spread_lo: null              # 中位数以下离中位数的距离 × spread_lo（null = 不动）；在 physics_clip 之前做
    spread_hi: null              # 中位数以上同理
eval:
  batch_size: 64
  report_dir: ${run.out_dir}/reports
