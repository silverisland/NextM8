# e1_final + 旧夜间口径（2026-10-12 之前的行为，在当前代码上复现）：夜间不进损失、决策层夜间归零。
#    用途：与 e1_final（夜间进损失、决策层不归零）同切分同种子 A/B，量化"夜间对齐"这一项到底值多少分。
#    预期：e1_night_old 的南网 D+1 高约 0.5–1 分（夜间强制 0 的红利），但它和 M1–M7 不可比。
run: {tag: e1_night_old, out_dir: runs/m8/e1_night_old}
train:
  schedule: {lr: 3.0e-4, max_steps: 6000, warmup_steps: 300, eval_every_steps: 250}
  early_stop: {patience: 8}
  loss: {night_weight: 0.0}
decision:
  physics: {night_zero: true}
  point: {default: p_star, by_step: [{steps: [0, 16], method: p_star_l1}, {steps: [55, 151], method: p_star}]}
