# K1 = j1_final2 + hint_dropout 0.3 → 0.1：线上一定有 TimesFM 列，为缺列买的保险可以减少，让模型更依赖提示
#    跑法：bash train_m8_variants.sh --splits_dir <m8_v1> --variants j1_final2,k1_hint01,k2_hint00,k3_resid,k4_lr2e4,k5_lr5e4,k6_regular --seeds 0,1,2 --batch_tag round7
run: {tag: k1_hint01, out_dir: runs/m8/k1_hint01}
features:
  derived: {clear_sky_ratio: {enabled: true}, history_envelope: {enabled: true}}
  future_only: [{col: timesfm3, scale: target}]
train:
  schedule: {lr: 3.0e-4, max_steps: 6000, warmup_steps: 300, eval_every_steps: 250}
  early_stop: {patience: 8}
  hint_dropout: 0.1
decision: {point: {default: p_star, by_step: [{steps: [0, 16], method: p_star_l1}, {steps: [55, 151], method: p_star}]}}
