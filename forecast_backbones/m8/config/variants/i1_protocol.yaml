# I1 训练协议（2026-10-13 调研 §6 的处方，骨干不动）：e1_final 的配方 + 四处协议改动
#    1. 模型减半：d_model 128 / d_ff 512 / head_hidden 128（2,700 站日 ≈ ETTh1 量级，剪枝与缩放律研究都说这个量级上模型偏大会很快过拟合）
#    2. 学习率 1e-4、cosine 8000 步（超参流水线：PatchTST 在 ETTh1 上 lr ≤1e-4 配更多 epoch 最好）
#    3. 权重 EMA 0.999（针对验证分评估间 ±1.5–3 分的震荡）
#    4. 按最近 3 次验证均值选点与早停（smooth_k 3），验证仍每 250 步
#    跑法：bash train_shell/train_m8_variants.sh --splits_dir ... --variants i1_protocol --seeds 0,1,2,3,4 --gpus 0,1,2,3,4 --batch_tag protocol
#    读法：和 e1_final 同种子对比 nanwang_short_D+1 与 train_log.json 里验证分的波动；再用 5 个成员做集成评估（eval_m8.sh --runs 五个目录）
run: {tag: i1_protocol, out_dir: runs/m8/i1_protocol}
model: {d_model: 128, d_ff: 512, head_hidden: 128}
train:
  schedule: {lr: 1.0e-4, max_steps: 8000, warmup_steps: 300, eval_every_steps: 250}
  early_stop: {patience: 8, smooth_k: 3}
  ema_decay: 0.999
decision: {point: {default: p_star, by_step: [{steps: [0, 16], method: p_star_l1}, {steps: [55, 151], method: p_star}]}}
