# Same training/data/decision recipe as pinball_control; only network changes.
run: {model_name: m4_rum, tag: rum_query, out_dir: runs/m4_rum/query, seeds: [0]}
dataset:
  station_meta: forecast_backbones/m8/station_meta.csv  # CSV 路径或 null；null 时使用 capacity_col 指定的数据容量列
  station_meta_cols:
    station_id: station_id
    station: station
    lat: lat
    lon: lon
    alt_m: alt_m
    cap_mw: cap_mw
model:
  architecture: query_decoder  # 可选 legacy / query_decoder；站点 embedding 和 extensions 仅支持 query_decoder
train:
  loss: pinball  # 可选 mse / mae / pinball；p_star 及分位数决策需 pinball；点输出与分位输出互换需重训
  history_dropout: 0.0
  hint_dropout: 0.0
  schedule: {batch_size: 8, precision: fp32, lr: 0.0003, max_steps: 6000, warmup_steps: 300, eval_every_steps: 250, save_every: 500}  # precision：可选 fp32 / fp16 / bf16；fp16 需 CUDA，bf16 需支持该精度的 CUDA 设备；eval_every_steps：正整数：每 N 步验证；null：每个 epoch 结束验证（需提供验证集）
decision:
  point:
    default: p_star  # 可选 median / p_star / p_star_l1；后两者需 pinball，by_step 可覆盖局部区间
    by_step: [{steps: [0, 16], method: p_star_l1}]  # 可选 median / p_star / p_star_l1；by_step 规则需 pinball
    clip_negative: true  # 可选 true / false；裁剪负预测，开启需 pinball
    capacity_cap: true  # 可选 true / false；按容量裁剪上限，开启需 pinball
