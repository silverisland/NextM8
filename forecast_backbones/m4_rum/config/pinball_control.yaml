# Controlled baseline: unchanged legacy network; tune training and reporting first.
run: {model_name: m4_rum, tag: rum_control, out_dir: runs/m4_rum/control, seeds: [0]}
dataset:
  station_meta: forecast_backbones/m8/station_meta.csv
  station_meta_cols:
    station_id: station_id
    station: station
    lat: lat
    lon: lon
    alt_m: alt_m
    cap_mw: cap_mw
model:
  architecture: legacy
train:
  loss: pinball
  history_dropout: 0.0
  hint_dropout: 0.0
  schedule: {batch_size: 8, precision: fp32, lr: 0.0003, max_steps: 6000, warmup_steps: 300, eval_every_steps: 250, save_every: 500}
decision:
  point:
    default: p_star
    by_step: [{steps: [0, 16], method: p_star_l1}]
    clip_negative: true
    capacity_cap: true
