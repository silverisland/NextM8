# M4 PatchTST; defaults are defined only in forecast_backbones/m4/config.py.
run:
  model_name: m4
  tag: patchtst
  out_dir: runs/m4/patchtst
features:
  hint_col: chronos
dataset:
  label_norm: [cap_power_on]
train:
  # Only the original main loss; no auxiliary term or loss multiplier.
  loss: mae
  schedule:
    lr: 0.0001
    batch_size: 64
    max_steps: 6000
    eval_every_steps: 250
    save_every: 500
    precision: fp32
