inference:
  is_training: 1          # 2 ft; 1 train; 0 inference
  checkpoints: './checkpoints/'
  model_id: 'm4_v321_test'
  pred_len: 192
  input_len: 672
  seq_len: 864
  ft_checkpoints: './checkpoints/'   #ft
  ft_model_id: 'm4_v321_test'        #ft

model:
  fc_dropout: 0.2
  head_dropout: 0.1
  patch_len: 96
  stride: 96
  padding_patch: 'None'
  revin: 1
  affine: 0
  subtract_last: 0
  individual: 0
  enc_in: 3 # 这里控制输入通道数量
  d_model: 256
  n_heads: 4
  e_layers: 4
  d_layers: 1
  d_ff: 1024
  factor: 1
  dropout: 0.1
  activation: 'ReLU'
  embedding_dim: 256
  loss_type: mae
  lambda_main: 100
  lambda_nw: 50
optimization:
  random_seed: 2025
  train_epochs: 100
  learning_rate: 0.0001
  lradj: 'TST'
  pct_start: 0.3
  num_workers: 0
  batch_size: 512
  patience: 10
  device: 'cuda'
  gpu: 0
  fp16: true
