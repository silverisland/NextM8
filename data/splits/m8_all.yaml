# M8 "全数据"切分（对齐 M1–M4 的训练方式）：不剔除测试期、不留验证块，训练文件夹里每一行都进 train.parquet。
#   与 m8_refit 的唯一区别：不传 --test-parquets，test_start 放在远未来，所以测试起点前的 purge 也没有 → 和 M1–M4 一样"带泄漏"。
#   用途：只做与 M1–M4 同口径的对照数字；配方必须在 m8_v1 上选，最终可信数字看 m8_refit（同配方同种子各跑一遍，两者之差 = 泄漏带来的虚高）。
#   python -m pipelines.time_splits --parquet "<训练文件夹>/*.parquet" --split-yaml data/splits/m8_all.yaml --dry-run   # 逐站训练占比应全为 1.0
#   python -m pipelines.time_splits --parquet "<训练文件夹>/*.parquet" --split-yaml data/splits/m8_all.yaml --out-dir data/splits/m8_all
#   bash train_shell/train_m8_variants.sh --splits_dir data/splits/m8_all --variants j1_final2 --seeds 0,1,2 --refit --max_steps 6000 --batch_tag final_all
train_start: null
test_start: "2030-01-01"           # 远未来占位：没有任何行落在测试段，也没有 purge
val_blocks: []
cal_days: 0
purge_days: 2
embargo_days: 7
allow_stations_without_val: true
