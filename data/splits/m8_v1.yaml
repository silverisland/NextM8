# M8 用的 train / valid 切分（测试集是独立文件，用 --test-parquets 推每站的测试起点，训练数据只在起点前留 2 天隔离带）
#   python -m pipelines.time_splits --parquet "<训练文件夹>/*.parquet" --test-parquets "<测试文件夹>/*.parquet" \
#       --split-yaml data/splits/m8_v1.yaml --dry-run            # 先看逐站报告
#   …同上去掉 --dry-run 加 --out-dir data/splits/m8_v1            # 落盘
train_start: null                  # 训练数据从最早一天起，不截

val_blocks:                        # 全站共用的验证块，左闭右开，各 21 天
  - ["2025-04-10", "2025-05-01"]   # 春：1002 1004 1009 1010 1015 1019
  - ["2025-07-16", "2025-08-06"]   # 夏：同上 6 站
  - ["2026-01-10", "2026-01-31"]   # 冬：1002 1003 1004 1009 1010 1012 1019

cal_days: 0                        # 不留校准段，M8 不用
purge_days: 2                      # 块前 2 天、测试起点前 2 天剔除（标签 192 步 = 2 天）
embargo_days: 7                    # 块后再加 7 天，合计 9 天 = 672 + 192 步

allow_stations_without_val: true   # 允许碰不到任何块的站只进训练：1005、华能北方、国能、西北戈壁、雅砻江

val_only_stations:                 # 整站只进验证、不进训练，模拟测试里没见过的站
  - "1006"                         # 2026-02-20 → 03-12，21 天
  - "1016"                         # 2026-03-07 → 03-31，25 天
  - "1022"                         # 2026-01-07 → 02-28，53 天，冬季
  - "泗洪光伏电站"                   # 2025-12-01 → 12-31，31 天，名字站、无测试集，作白马湖的代理
